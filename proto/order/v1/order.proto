syntax = "proto3";

package seckill.order.v1;

option go_package = "github.com/nbhaohao/go-seckill/internal/pb/orderv1";

import "google/protobuf/timestamp.proto";

// OrderService is the order ownership boundary. p1 uses its Go port through an
// in-process adapter; the generated gRPC surface is not started until p2.
service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (Order);
  rpc PlaceOrderAsync(PlaceOrderRequest) returns (AcceptedOrder);
  rpc GetOrderByRequestID(GetOrderByRequestIDRequest) returns (GetOrderByRequestIDResponse);
}

message PlaceOrderRequest {
  string request_id = 1;
  int64 product_id = 2;
  int64 user_id = 3;
  int32 quantity = 4;
}

message GetOrderByRequestIDRequest {
  string request_id = 1;
}

message GetOrderByRequestIDResponse {
  Order order = 1;
  bool pending = 2;
}

message Order {
  int64 id = 1;
  int64 product_id = 2;
  int64 user_id = 3;
  string request_id = 4;
  int32 quantity = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
}

message AcceptedOrder {
  string request_id = 1;
  int32 status = 2;
  google.protobuf.Timestamp accepted_at = 3;
}
